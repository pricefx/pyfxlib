[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry_core>=1.0.0"]

[tool.poetry]
authors = ["Pricefx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  'Programming Language :: Python :: 3 :: Only',
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
description = "Python utilities for working with Pricefx"
include = ["pyfxlib/py.typed"]
license = "Apache-2.0"
maintainers = ["Pricefx <noreply@pricefx.com>"]
name = "pyfxlib"
packages = [
  {include = "pyfxlib"},
  {include = "pyfxlib/_testtooling"}
]
readme = "README.md"
version = "1.1.0"

[tool.poetry.dependencies]
fastavro = {version = "^1.9"}
httpx = {version = "^0.28.1"}
numpy = {version = ">=1.26,<3"}
pandas = {version = "^2.2"}
pydantic = {version = ">=2.11.7"}
python = ">=3.11,<4.0"
SecretStorage = {version = "^3.3", platform = "linux"}
setuptools = {version = "^80.0"}

[tool.poetry.group.dev.dependencies]
black = "*"
docker = "^6.0"
flake8 = "*"
flake8-black = "*"
flake8-docstrings = "*"
isort = "*"
mypy = "*"
pdoc3 = "0.10.*"
pep8-naming = "*"
pytest = "*"
pytest-asyncio = ">=1.3.0"
toml-sort = "*"
types-jsonschema = "^4.21"

[tool.poetry.urls]
Changelog = "https://github.com/pricefx/pyfxlib/blob/develop/CHANGELOG.md"
Documentation = "https://developer.pricefx.eu/pricefx-api/pyfxlib/index.html"
Homepage = "https://pypi.org/project/pyfxlib/"
Repository = "https://github.com/pricefx/pyfxlib"

[tool.black]
line-length = 100

[tool.isort]
force_alphabetical_sort_within_sections = true
known_application = ["pyfxlib"]
profile = "appnexus"

[tool.pytest.ini_options]
markers = [
  "extended: marks extended tests, taking sometime quite a long time (deselect with '-m \"not extended\"')"
]

[tool.tomlsort]
ignore_case = true
in_place = true
sort_first = ["build-system", "tool.poetry"]
sort_inline_arrays = false
sort_inline_tables = false
sort_table_keys = true
